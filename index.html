<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>뉴스다 — 오늘 뉴스, 고양이가 콕</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #151820;
    --border: #1e2330;
    --accent: #4f8ef7;
    --accent3: #4ecb8d;
    --text: #e8eaf0;
    --muted: #6b7280;
    --pill-bg: #1a2035;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

  /* Header */
  header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: var(--bg); z-index: 100;
  }
  .logo { font-family: 'Noto Sans KR', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); display: flex; align-items: center; }
  .logo span { color: var(--text); }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .today-date { font-size: 11px; color: var(--text); font-family: 'DM Mono', monospace; }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent3); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Tabs */
  .tabs { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; border: 1px solid var(--border); background: transparent; color: var(--muted); transition: all 0.2s; }
  .tab:hover { border-color: var(--accent); color: var(--accent); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Main */
  .main { padding: 0 20px 100px; max-width: 720px; margin: 0 auto; }

  /* Time block */
  .time-block { margin-top: 24px; }
  .time-header {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .time-label {
    font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
    color: var(--accent); background: rgba(79,142,247,0.1);
    padding: 4px 10px; border-radius: 6px; white-space: nowrap;
  }
  .time-line { flex: 1; height: 1px; background: var(--border); }

  /* News card */
  .news-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; margin-bottom: 10px; overflow: hidden;
    cursor: pointer; transition: border-color 0.2s; position: relative;
  }
  .news-card:hover { border-color: #2a3550; }
  .news-card.expanded { border-color: var(--accent); }
  /* 중요 뉴스 왼쪽 색띠 */
  .news-card.high::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--accent2);
  }
  .news-card.high .card-header { padding-left: 18px; }

  .imp-badge {
    font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 4px;
    font-family: 'Noto Sans KR', sans-serif; background: rgba(224,92,92,0.15); color: #f08585;
  }

  .card-header { padding: 14px 16px; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

  .category-badge { font-size: 10px; font-weight: 500; padding: 3px 7px; border-radius: 4px; font-family: 'DM Mono', monospace; }
  .badge-politics { background: #1e2f5e; color: #7da4f5; }
  .badge-stock    { background: #1e3d2e; color: #4ecb8d; }
  .badge-entertainment { background: #3d1e3d; color: #d47df5; }
  .badge-social   { background: #3d2e1e; color: #f5a44e; }
  .badge-world    { background: #1e3a3d; color: #4ecfd4; }

  .card-time { font-size: 11px; color: var(--muted); font-family: 'DM Mono', monospace; margin-left: auto; }
  .card-title { font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 8px; }
  .card-title-ko { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: -4px; margin-bottom: 8px; }
  .card-keywords { display: flex; gap: 6px; flex-wrap: wrap; }
  .keyword { font-size: 11px; padding: 2px 7px; background: var(--pill-bg); border-radius: 4px; color: var(--muted); }

  /* Bias bar */
  .bias-bar-wrap { margin-top: 12px; }
  .bias-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--border); }
  .bias-seg { height: 100%; }
  .seg-left { background: #5b8def; }
  .seg-mid  { background: #7d6fc0; }
  .seg-right { background: #e06a6a; }
  .bias-bar-legend { display: flex; justify-content: space-between; margin-top: 5px; font-size: 10px; font-family: 'DM Mono', monospace; }
  .legend-left { color: #7da4f5; }
  .legend-mid  { color: #a99ad6; }
  .legend-right { color: #f08585; }

  /* AI Panel */
  .ai-panel { display: none; border-top: 1px solid var(--border); padding: 14px 16px; background: #0f1219; }
  .news-card.expanded .ai-panel { display: block; }

  .ai-section { margin-bottom: 16px; }
  .ai-section:last-child { margin-bottom: 0; }
  .ai-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .ai-label::before { content:''; display:inline-block; width:3px; height:12px; background:var(--accent); border-radius:2px; }

  .bias-row { display: flex; flex-direction: column; gap: 10px; }
  .bias-item { display: flex; align-items: flex-start; gap: 10px; }
  .bias-tag { font-size: 11px; font-weight: 500; width: 34px; flex-shrink: 0; padding-top: 2px; font-family: 'DM Mono', monospace; }
  .tag-left  { color: #7da4f5; }
  .tag-right { color: #f57d7d; }
  .tag-mid   { color: #4ecb8d; }
  .bias-text { font-size: 13px; color: #b0b8c8; line-height: 1.55; }
  .whathappened {
    font-size: 14px; color: #dde2ea; line-height: 1.6;
    background: rgba(124,196,74,0.08); border-left: 3px solid var(--accent3);
    padding: 12px 14px; border-radius: 0 8px 8px 0;
  }
  .bias-note { font-size: 11px; color: var(--muted); margin-top: 10px; padding: 8px 10px; background: rgba(79,142,247,0.06); border-radius: 6px; line-height: 1.5; }
  .butterfly-note { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: italic; }

  /* Source */
  .source-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .source-chip {
    font-size: 11px; padding: 4px 9px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; color: #b0b8c8;
    font-family: 'DM Mono', monospace;
  }
  .source-note { font-size: 11px; color: var(--muted); line-height: 1.5; }

  /* Event timeline */
  .event-timeline { display: flex; flex-direction: column; }
  .event-item { display: flex; align-items: flex-start; gap: 10px; }
  .event-date {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--accent);
    width: 34px; flex-shrink: 0; padding-top: 1px; text-align: right;
  }
  .event-dot-wrap { display: flex; flex-direction: column; align-items: center; width: 12px; flex-shrink: 0; }
  .event-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent3); margin-top: 4px; flex-shrink: 0; }
  .event-vline { width: 1px; flex: 1; min-height: 16px; background: var(--border); margin-top: 2px; }
  .event-item:last-child .event-vline { display: none; }
  .event-text { font-size: 13px; color: #b0b8c8; line-height: 1.5; padding-bottom: 14px; }

  /* Data grid */
  .data-grid { display: flex; gap: 8px; flex-wrap: wrap; }
  .data-cell {
    flex: 1; min-width: 90px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 10px; text-align: center;
  }
  .data-value { font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500; color: var(--accent3); margin-bottom: 4px; }
  .data-label { font-size: 11px; color: var(--muted); line-height: 1.3; }

  /* Community */
  .react-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .react-btn {
    font-size: 12px; padding: 7px 11px; border-radius: 8px;
    background: var(--pill-bg); border: 1px solid var(--border);
    color: #b0b8c8; cursor: pointer; font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }
  .react-btn:hover { border-color: var(--accent); }
  .react-btn.voted { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.1); }
  .react-count { font-family: 'DM Mono', monospace; margin-left: 2px; }

  .comment-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .comment-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 9px 12px; color: var(--text); font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif; outline: none;
  }
  .comment-input:focus { border-color: var(--accent); }
  .comment-send {
    padding: 9px 14px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; font-size: 13px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap;
  }
  .comment-item {
    font-size: 13px; color: #c5cbd6; padding: 8px 10px; background: var(--surface);
    border-radius: 8px; margin-bottom: 6px; line-height: 1.45;
  }
  .comment-empty { font-size: 12px; color: var(--muted); padding: 4px 0; }

  /* Butterfly */
  .butterfly-chain { display: flex; flex-direction: column; }
  .chain-item { display: flex; align-items: flex-start; gap: 10px; }
  .chain-left { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .chain-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 5px; }
  .chain-line { width: 1px; flex: 1; min-height: 18px; background: linear-gradient(to bottom, var(--accent), transparent); margin-top: 2px; }
  .chain-item:last-child .chain-line { display: none; }
  .chain-text { font-size: 13px; color: #b0b8c8; line-height: 1.5; padding-bottom: 14px; }

  /* Loading */
  .skeleton { background: linear-gradient(90deg, var(--border) 25%, #222840 50%, var(--border) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .fetch-btn {
    flex: 1; padding: 13px; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; font-size: 14px; font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: opacity 0.2s;
  }
  .fetch-btn:hover { opacity: 0.85; }
  .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sample-btn {
    padding: 13px 18px; background: transparent; color: var(--muted);
    border: 1px solid var(--border); border-radius: 10px; font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: all 0.2s; white-space: nowrap;
  }
  .sample-btn:hover { border-color: var(--accent); color: var(--accent); }

  .error-msg { background: #2a1515; border: 1px solid #5e2020; border-radius: 8px; padding: 12px 16px; font-size: 13px; color: #f57d7d; margin-top: 8px; }

  /* Filter bar */
  .filter-bar { padding: 14px 0 4px; }
  .imp-toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: #b0b8c8; user-select: none; }
  .imp-toggle input { width: 16px; height: 16px; accent-color: var(--accent2); cursor: pointer; }

  /* Top 3 */
  .top3-box {
    background: linear-gradient(135deg, #1a2540, #1e2030);
    border: 1px solid #2a3550; border-radius: 14px;
    padding: 16px; margin: 14px 0 20px;
  }
  .top3-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .top3-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .top3-sub { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--accent); }
  .top3-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .top3-item:last-child { border-bottom: none; }
  .top3-rank {
    width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace;
  }
  .top3-text { flex: 1; font-size: 13px; color: #dde2ea; line-height: 1.4; }
  .top3-cat { font-size: 10px; color: var(--muted); flex-shrink: 0; font-family: 'DM Mono', monospace; }

  /* Views */
  .view { display: none; }
  .view.active { display: block; }
  .page-title { font-size: 20px; font-weight: 700; margin: 24px 0 6px; }
  .page-desc { font-size: 13px; color: var(--muted); margin-bottom: 20px; line-height: 1.5; }
  .bf-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .bf-card-title { font-size: 14px; font-weight: 500; margin-bottom: 12px; line-height: 1.4; }
  .comm-stats { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-family: 'DM Mono', monospace; }

  /* Settings */
  .setting-group { margin-bottom: 24px; }
  .setting-label { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
  .setting-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .set-chip { font-size: 13px; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: all 0.2s; }
  .set-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .set-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: #c5cbd6; }
  .set-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .set-info { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* Bottom nav */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); display: flex; padding: 10px 0 18px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--muted); cursor: pointer; padding: 4px 0; transition: color 0.2s; }
  .nav-item.active { color: var(--accent); }
  .nav-icon { font-size: 20px; }

  .spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 120 120" style="vertical-align:middle;margin-right:2px">
      <circle cx="60" cy="54" r="40" fill="#fff"/>
      <path d="M60 16 a40 40 0 0 1 37 25 q-20 -7 -37 -5 q-17 -2 -37 5 a40 40 0 0 1 37 -25z" fill="#b89968"/>
      <path d="M28 30 q-7 -11 2 -18 q11 5 13 18z" fill="#b89968"/>
      <path d="M92 30 q7 -11 -2 -18 q-11 5 -13 18z" fill="#b89968"/>
      <circle cx="46" cy="56" r="10" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>
      <circle cx="74" cy="56" r="10" fill="#fff" stroke="#2b2b2b" stroke-width="2.5"/>
      <circle cx="46" cy="56" r="7" fill="#7cc44a"/>
      <circle cx="74" cy="56" r="7" fill="#7cc44a"/>
      <circle cx="46" cy="56" r="4" fill="#1a1a1a"/>
      <circle cx="74" cy="56" r="4" fill="#1a1a1a"/>
      <circle cx="48" cy="53" r="1.5" fill="#fff"/>
      <circle cx="76" cy="53" r="1.5" fill="#fff"/>
      <path d="M56 67 h8 l-4 5z" fill="#e89aae"/>
    </svg>뉴스<span>다</span></div>
  <div class="header-right">
    <div class="today-date" id="todayDate"></div>
    <div class="live-badge"><div class="live-dot"></div>AI 분석</div>
  </div>
</header>

<div id="view-news" class="view active">
<div class="tabs">
  <div class="tab active" onclick="setTab(this,'전체')">전체</div>
  <div class="tab" onclick="setTab(this,'정치')">🏛 정치</div>
  <div class="tab" onclick="setTab(this,'증권')">📈 증권</div>
  <div class="tab" onclick="setTab(this,'연예')">🎬 연예</div>
  <div class="tab" onclick="setTab(this,'시사')">🌐 시사</div>
  <div class="tab" onclick="setTab(this,'해외')">🇺🇸 해외</div>
</div>

<div class="main">
  <div class="filter-bar">
    <label class="imp-toggle">
      <input type="checkbox" id="impOnly" onchange="filterNews()">
      <span>🔴 중요한 뉴스만 보기</span>
    </label>
  </div>
  <div id="newsList"></div>
  <div class="btn-row">
    <button class="fetch-btn" id="fetchBtn" onclick="fetchNews()">🤖 AI 뉴스 불러오기</button>
    <button class="sample-btn" onclick="loadSample()">샘플 보기</button>
  </div>
  <div id="errorMsg"></div>
</div>
</div>

<div id="view-butterfly" class="view">
  <div class="main">
    <div class="page-title">🦋 나비효과 모아보기</div>
    <div class="page-desc">오늘 뉴스들이 만들어낼 연쇄 효과를 한눈에.</div>
    <div id="butterflyList"></div>
  </div>
</div>

<div id="view-community" class="view">
  <div class="main">
    <div class="page-title">💬 커뮤니티</div>
    <div class="page-desc">사람들이 어떤 뉴스에 어떻게 반응하는지 모아봤어요.</div>
    <div id="communityList"></div>
  </div>
</div>

<div id="view-settings" class="view">
  <div class="main">
    <div class="page-title">⚙️ 설정</div>
    <div class="setting-group">
      <div class="setting-label">관심 카테고리</div>
      <div class="setting-chips">
        <span class="set-chip active" onclick="this.classList.toggle('active')">정치</span>
        <span class="set-chip active" onclick="this.classList.toggle('active')">증권</span>
        <span class="set-chip" onclick="this.classList.toggle('active')">연예</span>
        <span class="set-chip" onclick="this.classList.toggle('active')">시사</span>
        <span class="set-chip" onclick="this.classList.toggle('active')">해외</span>
      </div>
    </div>
    <div class="setting-group">
      <div class="setting-label">표시 옵션</div>
      <label class="set-row"><span>중요 뉴스 먼저 보기</span><input type="checkbox" checked></label>
      <label class="set-row"><span>해외 뉴스 한글 번역</span><input type="checkbox" checked></label>
    </div>
    <div class="setting-group">
      <div class="setting-label">앱 정보</div>
      <div class="set-info">뉴스다 🐱 · 프로토타입 v0.5</div>
      <div class="set-info">정보 과잉 시대, 고양이가 핵심만 콕 집어줄게요.</div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <div class="nav-item active" onclick="switchView('news',this)"><div class="nav-icon">📰</div>뉴스</div>
  <div class="nav-item" onclick="switchView('butterfly',this)"><div class="nav-icon">🦋</div>나비효과</div>
  <div class="nav-item" onclick="switchView('community',this)"><div class="nav-icon">💬</div>커뮤니티</div>
  <div class="nav-item" onclick="switchView('settings',this)"><div class="nav-icon">⚙️</div>설정</div>
</nav>

<script>
let currentTab = '전체';
let allCards = [];
let currentNews = [];

const today = new Date();
document.getElementById('todayDate').textContent = today.toLocaleDateString('ko-KR', {
  year:'numeric', month:'long', day:'numeric', weekday:'short'
});

// 샘플 뉴스 데이터
const SAMPLE_NEWS = [
  {
    category: '정치', hour: '09:00', importance: 'high', sources: ["연합뉴스","YTN","뉴스1"], biasRatio: [55,25,20],

function setTab(el, tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentTab = tab;
  filterNews();
}

function switchView(name, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  window.scrollTo(0, 0);
  if (name === 'butterfly') renderButterfly();
  if (name === 'community') renderCommunity();
}

function renderButterfly() {
  const el = document.getElementById('butterflyList');
  if (!currentNews.length) { el.innerHTML = '<div class="page-desc">먼저 뉴스 탭에서 뉴스를 불러와주세요.</div>'; return; }
  el.innerHTML = currentNews.filter(n => n.butterfly && n.butterfly.length).map(n => `
    <div class="bf-card">
      <div class="bf-card-title">${n.titleKo || n.title}</div>
      <div class="butterfly-chain">
        ${n.butterfly.map(step => `
          <div class="chain-item">
            <div class="chain-left"><div class="chain-dot"></div><div class="chain-line"></div></div>
            <div class="chain-text">${step}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function renderCommunity() {
  const el = document.getElementById('communityList');
  const keys = Object.keys(communityData).filter(k => {
    const d = communityData[k];
    return d.left || d.right || d.mid || (d.comments && d.comments.length);
  });
  if (!keys.length) { el.innerHTML = '<div class="page-desc">아직 활동이 없어요. 뉴스 탭에서 공감하거나 의견을 남겨보세요.</div>'; return; }
  el.innerHTML = keys.map(k => {
    const d = communityData[k];
    return `
      <div class="bf-card">
        <div class="bf-card-title">${k}</div>
        <div class="comm-stats">
          👈 진보 ${d.left} · 🤝 균형 ${d.mid} · 👉 보수 ${d.right} · 💬 ${d.comments ? d.comments.length : 0}
        </div>
        ${d.comments && d.comments.length ? d.comments.map(c => `<div class="comment-item">${c.replace(/</g,'&lt;')}</div>`).join('') : ''}
      </div>
    `;
  }).join('');
}

function filterNews() {
  const impOnly = document.getElementById('impOnly') && document.getElementById('impOnly').checked;
  // 타임블록 단위로 필터
  document.querySelectorAll('.time-block').forEach(block => {
    const cards = block.querySelectorAll('.news-card');
    let visible = 0;
    cards.forEach(card => {
      const matchTab = currentTab === '전체' || card.dataset.category === currentTab;
      const matchImp = !impOnly || card.classList.contains('high');
      const show = matchTab && matchImp;
      card.style.display = show ? 'block' : 'none';
      if (show) visible++;
    });
    block.style.display = visible > 0 ? 'block' : 'none';
  });
}

function toggleCard(card) {
  const wasExpanded = card.classList.contains('expanded');
  document.querySelectorAll('.news-card').forEach(c => c.classList.remove('expanded'));
  if (!wasExpanded) card.classList.add('expanded');
}

// 커뮤니티 데이터 (세션 동안 유지)
const communityData = {};

function react(e, type) {
  e.stopPropagation();
  const btn = e.currentTarget;
  const row = btn.closest('.react-row');
  const newsId = row.dataset.news;
  if (!communityData[newsId]) communityData[newsId] = { left:0, right:0, mid:0, comments:[] };

  // 이미 누른 버튼이면 취소, 아니면 카운트
  if (btn.classList.contains('voted')) {
    communityData[newsId][type]--;
    btn.classList.remove('voted');
  } else {
    // 같은 그룹 내 다른 투표 취소
    row.querySelectorAll('.react-btn.voted').forEach(b => {
      b.classList.remove('voted');
    });
    // 이전 투표 카운트 정리
    ['left','right','mid'].forEach(t => {
      const target = row.querySelector(`[data-type="${t}"]`);
    });
    communityData[newsId][type]++;
    btn.classList.add('voted');
  }
  // 카운트 갱신
  const btns = row.querySelectorAll('.react-btn');
  btns[0].querySelector('.react-count').textContent = communityData[newsId].left;
  btns[1].querySelector('.react-count').textContent = communityData[newsId].right;
  btns[2].querySelector('.react-count').textContent = communityData[newsId].mid;
}

function addComment(e) {
  e.stopPropagation();
  const section = e.currentTarget.closest('.ai-section');
  const input = section.querySelector('.comment-input');
  const listEl = section.querySelector('.comment-list');
  const newsId = section.querySelector('.react-row').dataset.news;
  const text = input.value.trim();
  if (!text) return;

  if (!communityData[newsId]) communityData[newsId] = { left:0, right:0, mid:0, comments:[] };
  communityData[newsId].comments.unshift(text);
  input.value = '';
  renderComments(listEl, communityData[newsId].comments);
}

function renderComments(listEl, comments) {
  if (!comments || comments.length === 0) {
    listEl.innerHTML = '<div class="comment-empty">아직 의견이 없어요. 첫 의견을 남겨보세요.</div>';
    return;
  }
  listEl.innerHTML = comments.map(c => `<div class="comment-item">${c.replace(/</g,'&lt;')}</div>`).join('');
}

function renderNews(news) {
  currentNews = news;
  const list = document.getElementById('newsList');
  list.innerHTML = '';
  allCards = [];

  while (tops.length < 3 && tops.length < news.length) {
    const next = news.find(n => !tops.includes(n));
    if (!next) break;
    tops.push(next);
  }
  if (tops.length) {
    const topBox = document.createElement('div');
    topBox.className = 'top3-box';
    topBox.innerHTML = `
      <div class="top3-head">
        <span class="top3-title">바쁘신가요? 이것만 콕 🐱</span>
        <span class="top3-sub">오늘의 TOP ${tops.length}</span>
      </div>
      ${tops.map((t,i) => `
        <div class="top3-item" data-title="${t.title.replace(/"/g,'&quot;')}">
          <span class="top3-rank">${i+1}</span>
          <span class="top3-text">${t.titleKo || t.title}</span>
          <span class="top3-cat">${t.category}</span>
        </div>
      `).join('')}
    `;
    list.appendChild(topBox);
    // 클릭하면 해당 뉴스 카드로 이동 + 펼침
    topBox.querySelectorAll('.top3-item').forEach(el => {
      el.onclick = () => {
        const title = el.dataset.title;
        const target = allCards.find(c => c.querySelector('.card-title') && c.querySelector('.card-title').textContent === title);
        if (target) {
          document.querySelectorAll('.news-card').forEach(c => c.classList.remove('expanded'));
          target.classList.add('expanded');
          target.scrollIntoView({behavior:'smooth', block:'center'});
        }
      };
    });
  }

  const badgeMap = {
    '정치': 'badge-politics',
    '증권': 'badge-stock',
    '연예': 'badge-entertainment',
    '시사': 'badge-social',
    '해외': 'badge-world'
  };

  // 시간대별로 그룹핑
  const grouped = {};
  news.forEach(item => {
    const h = item.hour || '기타';
    if (!grouped[h]) grouped[h] = [];
    grouped[h].push(item);
  });

  // 시간 순 정렬
  const sortedHours = Object.keys(grouped).sort();

  sortedHours.forEach(hour => {
    const block = document.createElement('div');
    block.className = 'time-block';

    block.innerHTML = `
      <div class="time-header">
        <span class="time-label">🕐 ${hour}</span>
        <div class="time-line"></div>
      </div>
    `;

    grouped[hour].forEach(item => {
      const card = document.createElement('div');
      card.className = 'news-card' + (item.importance === 'high' ? ' high' : '');
      card.dataset.category = item.category;
      card.onclick = () => toggleCard(card);

      card.innerHTML = `
        <div class="card-header">
          <div class="card-meta">
            <span class="category-badge ${badgeMap[item.category] || 'badge-social'}">${item.category}</span>
            ${item.importance === 'high' ? '<span class="imp-badge">🔴 중요</span>' : ''}
            <span class="card-time">${item.hour}</span>
          </div>
          <div class="card-title">${item.title}</div>
          ${item.titleKo ? `<div class="card-title-ko">${item.titleKo}</div>` : ''}
          <div class="card-keywords">
            ${item.keywords.map(k => `<span class="keyword">#${k}</span>`).join('')}
          </div>
          ${item.biasRatio ? `
          <div class="bias-bar-wrap">
            <div class="bias-bar">
              <div class="bias-seg seg-left" style="width:${item.biasRatio[0]}%"></div>
              <div class="bias-seg seg-mid" style="width:${item.biasRatio[1]}%"></div>
              <div class="bias-seg seg-right" style="width:${item.biasRatio[2]}%"></div>
            </div>
            <div class="bias-bar-legend">
              <span class="legend-left">진보 ${item.biasRatio[0]}%</span>
              <span class="legend-mid">중도 ${item.biasRatio[1]}%</span>
              <span class="legend-right">보수 ${item.biasRatio[2]}%</span>
            </div>
          </div>` : ''}
        </div>
        <div class="ai-panel">
          <div class="ai-section">
            <div class="ai-label">📍 무슨 일이 있었나</div>
            <div class="whathappened">${item.summary || item.neutral}</div>
          </div>
          <div class="ai-section">
            <div class="ai-label">양쪽은 이렇게 봐요</div>
            <div class="bias-row">
              <div class="bias-item"><span class="bias-tag tag-left">진보</span><span class="bias-text">${item.left}</span></div>
              <div class="bias-item"><span class="bias-tag tag-right">보수</span><span class="bias-text">${item.right}</span></div>
            </div>
            <div class="bias-note">뉴스다는 판단하지 않아요. 양쪽 시각을 두고 직접 판단해보세요. 🐱</div>
          </div>
          ${item.timeline && item.timeline.length ? `
          <div class="ai-section">
            <div class="ai-label">📌 사건 경과</div>
            <div class="event-timeline">
              ${item.timeline.map(t => `
                <div class="event-item">
                  <span class="event-date">${t.date}</span>
                  <div class="event-dot-wrap"><div class="event-dot"></div><div class="event-vline"></div></div>
                  <span class="event-text">${t.text}</span>
                </div>
              `).join('')}
            </div>
          </div>` : ''}
          ${item.data && item.data.length ? `
          <div class="ai-section">
            <div class="ai-label">📊 관련 수치</div>
            <div class="data-grid">
              ${item.data.map(d => `
                <div class="data-cell">
                  <div class="data-value">${d.value}</div>
                  <div class="data-label">${d.label}</div>
                </div>
              `).join('')}
            </div>
          </div>` : ''}
          <div class="ai-section">
            <div class="ai-label">🦋 나비효과</div>
            <div class="butterfly-chain">
              ${item.butterfly.map(step => `
                <div class="chain-item">
                  <div class="chain-left"><div class="chain-dot"></div><div class="chain-line"></div></div>
                  <div class="chain-text">${step}</div>
                </div>
              `).join('')}
            </div>
            <div class="butterfly-note">예상 시나리오예요. 실제와 다를 수 있어요.</div>
          </div>
          <div class="ai-section">
            <div class="ai-label">📰 출처</div>
            ${item.sources && item.sources.length ? `
              <div class="source-row">
                ${item.sources.map(s => `<span class="source-chip">${s}</span>`).join('')}
              </div>
              <div class="source-note">위 언론 보도를 AI가 종합·요약했어요. 원문은 각 언론사에서 확인하세요.</div>
            ` : `<div class="source-note">실제 기사 연동 예정 (정식 출시 시 원문 링크 제공)</div>`}
          </div>
          <div class="ai-section">
            <div class="ai-label">💬 커뮤니티</div>
            <div class="react-row" data-news="${item.title}">
              <button class="react-btn" onclick="react(event,'left')">👈 진보 공감 <span class="react-count">0</span></button>
              <button class="react-btn" onclick="react(event,'right')">👉 보수 공감 <span class="react-count">0</span></button>
              <button class="react-btn" onclick="react(event,'mid')">🤝 균형 <span class="react-count">0</span></button>
            </div>
            <div class="comment-input-row" onclick="event.stopPropagation()">
              <input class="comment-input" placeholder="한 줄 의견을 남겨보세요" onkeydown="if(event.key==='Enter')addComment(event)" onclick="event.stopPropagation()">
              <button class="comment-send" onclick="addComment(event)">등록</button>
            </div>
            <div class="comment-list"><div class="comment-empty">아직 의견이 없어요. 첫 의견을 남겨보세요.</div></div>
          </div>
        </div>
      `;

      block.appendChild(card);
      allCards.push(card);
    });

    list.appendChild(block);
  });

  filterNews();
}

function loadSample() {
  renderNews(SAMPLE_NEWS);
  document.getElementById('fetchBtn').innerHTML = '🔄 새로고침';
}

async function fetchNews() {
  const btn = document.getElementById('fetchBtn');
  const list = document.getElementById('newsList');
  const errEl = document.getElementById('errorMsg');
  errEl.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>뉴스다가 뉴스 고르는 중...';

  list.innerHTML = `<div style="padding:20px 0">${[80,60,90,50,70,65,85,55].map(w=>`<div class="skeleton" style="height:16px;width:${w}%;margin-bottom:10px"></div>`).join('')}</div>`;

  const todayStr = today.toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric'});

  const prompt = `오늘(${todayStr}) 주요 뉴스를 한국 정치 2개, 증권 2개, 연예 2개, 시사 2개, 해외(미국 등) 2개 총 10개 분석해줘.

반드시 아래 JSON 형식으로만 응답해. 다른 텍스트 없이 JSON만 출력:

[
  {
    "category": "정치",
    "hour": "09:00",
    "importance": "high 또는 normal (내 삶에 직접 영향이 크고 화제성이 높으면 high)",
    "title": "뉴스 제목",
    "titleKo": "(해외 뉴스만) 영문 제목의 한글 번역, 한국 뉴스는 생략",
    "keywords": ["키워드1","키워드2","키워드3"],
    "summary": "이 뉴스가 무슨 일인지 배경 모르는 사람도 이해되게 3~4문장으로 친절하게 설명 (누가/무엇을/왜/지금 상황)",
    "biasRatio": [55,25,20],
    "left": "진보 시각 1~2문장",
    "right": "보수 시각 1~2문장",
    "neutral": "한 줄 핵심 요약 (summary의 압축판)",
    "timeline": [{"date":"6/3","text":"사건 경과 항목"},{"date":"6/9","text":"최근 진행 상황"}],
    "data": [{"label":"지표명","value":"수치"},{"label":"지표명2","value":"수치2"}],
    "butterfly": ["1단계 영향","2단계 파급","3단계 장기 결과"],
    "sources": ["연합뉴스","YTN"]
  }
]

해외 뉴스(category가 "해외")는 title을 영어 원문으로 쓰고 titleKo에 한글 번역을 넣어줘. 한국 뉴스는 title을 한글로 쓰고 titleKo는 비워둬. summary가 가장 중요해. 그 뉴스를 처음 접한 사람도 "아 이런 일이 있었구나"를 바로 이해하도록 배경·맥락을 친절하게 풀어써줘 (제목만 함축하지 말고). timeline은 사건 경과를 3~4개 날짜순으로, data는 관련 핵심 수치 2~3개를 넣어줘. importance는 금리·세금·부동산·법개정 등 독자 삶에 직접 영향이 크거나 화제성이 매우 높은 뉴스만 "high", 나머지는 "normal"로 (전체의 30~40%만 high). biasRatio는 이 이슈를 보도한 언론들의 진보/중도/보수 논조 비율을 합 100으로 추정 (예: [55,25,20]). sources는 이 이슈를 보도한 실제 주요 언론사 2~3곳 이름. 각 뉴스의 hour는 다양하게(07:00~18:00). 실제 최신 이슈 기반으로 작성해줘.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 6000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || '오류 발생');

    const raw = data.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const news = JSON.parse(clean);

    renderNews(news);
    btn.innerHTML = '🔄 새로고침';
    btn.disabled = false;

  } catch (e) {
    list.innerHTML = '';
    errEl.innerHTML = `<div class="error-msg">🐱 뉴스다가 잠깐 길을 잃었어요. '샘플 보기'를 눌러보세요.</div>`;
    btn.innerHTML = '🤖 AI 뉴스 불러오기';
    btn.disabled = false;
  }
}

// 시작시 샘플 자동 로드
loadSample();
</script>
</body>
</html>
